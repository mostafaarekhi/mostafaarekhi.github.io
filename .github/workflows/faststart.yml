name: Optimize portfolio video startup
on:
  push:
    branches: [main]
    paths: [.github/workflows/faststart.yml]
permissions:
  contents: write
jobs:
  optimize:
    if: github.event.head_commit.message == 'Run approved one-time lossless video startup optimization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Remux without changing picture or sound
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess
          html = pathlib.Path('index.html').read_text()
          files = re.findall(r'data-src="(assets/[^"?]+\.mp4)', html)
          assert len(files) == len(set(files)) == 14
          report = []
          def stream_hash(path, stream):
              return subprocess.check_output(['ffmpeg', '-v', 'error', '-i', str(path), '-map', stream, '-c', 'copy', '-f', 'hash', '-hash', 'sha256', '-'], text=True).strip()
          for name in files:
              original = pathlib.Path(name)
              temp = original.with_suffix('.faststart.mp4')
              before_size = original.stat().st_size
              before = [stream_hash(original, stream) for stream in ('0:v:0', '0:a:0')]
              subprocess.run(['ffmpeg', '-v', 'error', '-i', str(original), '-map', '0', '-c', 'copy', '-map_metadata', '-1', '-movflags', '+faststart', '-y', str(temp)], check=True)
              after = [stream_hash(temp, stream) for stream in ('0:v:0', '0:a:0')]
              assert before == after, f'Encoded stream changed: {name}'
              data = temp.read_bytes()
              atoms = []
              offset = 0
              while offset + 8 <= len(data):
                  size = int.from_bytes(data[offset:offset+4], 'big')
                  assert size >= 8
                  atoms.append(data[offset+4:offset+8].decode('ascii'))
                  offset += size
              assert atoms.index('moov') < atoms.index('mdat'), name
              report.append({'file': name, 'before_bytes': before_size, 'after_bytes': len(data), 'video_audio_unchanged': True, 'faststart': True})
              temp.replace(original)
          pathlib.Path('video-optimization.json').write_text(json.dumps(report, indent=2) + '\n')
          print('Before:', sum(r['before_bytes'] for r in report), 'After:', sum(r['after_bytes'] for r in report))
          PY
      - name: Save verified files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/faststart.yml
          git add assets/*.mp4 video-optimization.json
          git add -u .github/workflows/faststart.yml
          git diff --cached --quiet || git commit -m "Optimize MP4 startup with unchanged video and audio streams"
          git push origin HEAD:main
